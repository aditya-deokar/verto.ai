# Software factory: when a CI workflow fails on the default branch, open one
# factory:regression issue per failing workflow (or comment on the open one).
# No agent and no API key: this is plain gh. The issue then goes through
# issue-triage like any other.
#
# Edit `workflows:` to list the names of the CI workflows to watch.
name: Factory monitor

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  issues: write
  actions: read

concurrency:
  group: factory-monitor-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh label create factory:regression --color D93F0B --description "Found by factory-monitor" 2>/dev/null || true
          title="Regression: $WORKFLOW failing on $BRANCH"
          body=$(printf 'Workflow **%s** failed on `%s` at %s.\n\nRun: %s\n\nOpened by factory-monitor. Triage it with issue-triage; the change merged at %s is the first suspect.' \
            "$WORKFLOW" "$BRANCH" "$SHA" "$RUN_URL" "$SHA")
          existing=$(gh issue list --label factory:regression --state open --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label factory:regression --body "$body"
          fi
